    <script>
        (function () {
            var input = document.querySelector('.gr-field');
            var form = document.getElementById('search_main_form');
            var resultsEl = document.getElementById('search-results');
            var emptyEl = document.getElementById('search-empty');
            var countEl = document.getElementById('search-count');
            if (!input || !form || !resultsEl || !emptyEl || !countEl) {
                return;
            }

            var pages = [
                {
                    section: 'Accueil',
                    title: 'Accueil',
                    url: '/fr/',
                    description: 'Page d\'accueil principale et aperçu rapide.',
                    keywords: 'accueil principal aperçu'
                },
                {
                    section: 'À Propos',
                    title: 'À Propos de Moi',
                    url: '/aboutmefr/',
                    description: 'Arrière-plan, histoire et compétences.',
                    keywords: 'à propos aboutme histoire compétences'
                },
                {
                    section: 'Projets',
                    title: 'Scratch 3.0',
                    url: '/projectfr/#scratch',
                    description: 'Projets de langage de programmation visuel.',
                    keywords: 'scratch projets portfolio'
                },
                {
                    section: 'Projets',
                    title: 'Mon Semestre',
                    url: '/projectfr/#mysemester',
                    description: 'Application web de planification de notes.',
                    keywords: 'mon semestre planificateur notes'
                },
                {
                    section: 'Projets',
                    title: 'Minuteur Notion',
                    url: '/projectfr/#notion-timer',
                    description: 'Minuteur style Pomodoro pour Notion.',
                    keywords: 'notion minuteur productivité'
                },
                {
                    section: 'Projets',
                    title: 'TeamTomorrow',
                    url: '/projectfr/#team-tomorrow',
                    description: 'Plateforme EdTech et de mentorat.',
                    keywords: 'teamtomorrow mentorat éducation'
                },
                {
                    section: 'Projets',
                    title: 'UTKCC',
                    url: '/projectfr/#utkcc',
                    description: 'Communauté Coréenne de l\'Université de Toronto.',
                    keywords: 'utkcc uoft communauté'
                },
                {
                    section: 'Projets',
                    title: 'LFTimes',
                    url: '/projectfr/#lftimes',
                    description: 'Publication d\'actualités étudiantes.',
                    keywords: 'lftimes actualités publication'
                },
                {
                    section: 'Musique',
                    title: 'Musique',
                    url: '/musicfr/',
                    description: 'Musique personnels et loisirs.',
                    keywords: 'intérêts loisirs jeux'
                },
                {
                    section: 'Contact',
                    title: 'Contact',
                    url: '/contactfr/',
                    description: 'Contactez-nous, réseaux sociaux et email.',
                    keywords: 'contact email réseaux sociaux'
                },
                {
                    section: 'Recherche',
                    title: 'Recherche',
                    url: '/searchfr/',
                    description: 'Rechercher sur le site.',
                    keywords: 'recherche'
                }
            ];

            function normalize(value) {
                return String(value || '').toLowerCase().trim();
            }

            function renderResults(matches) {
                resultsEl.innerHTML = '';
                resultsEl.classList.remove('is-visible');
                if (!matches.length) {
                    countEl.textContent = '';
                    emptyEl.style.display = 'block';
                    return;
                }
                emptyEl.style.display = 'none';
                countEl.textContent = matches.length + ' result' + (matches.length === 1 ? '' : 's');
                matches.forEach(function (item, index) {
                    var card = document.createElement('a');
                    card.className = 'search-result';
                    card.href = item.url;
                    card.style.transitionDelay = (index * 40) + 'ms';
                    card.innerHTML =
                        '<div class="search-result-meta">' + item.section + '</div>' +
                        '<div class="search-result-title">' + item.title + '</div>' +
                        '<div class="search-result-desc">' + item.description + '</div>';
                    resultsEl.appendChild(card);
                });
                requestAnimationFrame(function () {
                    resultsEl.classList.add('is-visible');
                });
            }

            function runSearch(value) {
                var query = normalize(value);
                if (!query) {
                    renderResults([]);
                    return;
                }
                var matches = pages.filter(function (page) {
                    var haystack = normalize(page.title + ' ' + page.description + ' ' + page.keywords);
                    return haystack.indexOf(query) !== -1;
                });
                renderResults(matches);
            }

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                runSearch(input.value);
            });

            input.addEventListener('input', function (event) {
                runSearch(event.target.value);
            });

            var params = new URLSearchParams(window.location.search);
            var preset = params.get('s');
            if (preset) {
                input.value = preset;
                runSearch(preset);
            }
        })();
    </script>
    <script>
        (function () {
            var toggles = document.querySelectorAll('.theme-toggle-btn-main');
            if (!toggles.length) {
                return;
            }
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var stored = localStorage.getItem('theme');
            var isDark = stored ? stored === 'dark' : prefersDark;
            function applyTheme() {
                document.body.classList.toggle('dark-mode', isDark);
                toggles.forEach(function (button) {
                    button.setAttribute('aria-pressed', isDark ? 'true' : 'false');
                    button.title = isDark ? 'Basculer en mode clair' : 'Basculer en mode sombre';
                    button.setAttribute('aria-label', button.title);
                    button.innerHTML = isDark ? '<ion-icon name="sunny"></ion-icon>' : '<ion-icon name="moon"></ion-icon>';
                });
            }
            toggles.forEach(function (button) {
                button.addEventListener('click', function () {
                    isDark = !isDark;
                    localStorage.setItem('theme', isDark ? 'dark' : 'light');
                    applyTheme();
                });
            });
            applyTheme();
        })();
    </script>
